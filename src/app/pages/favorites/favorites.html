<div class="bg-gray-50 min-h-screen py-10 font-sans">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <div class="mb-8">
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight flex items-center gap-3">
        <span class="material-icons text-red-500 text-3xl">favorite</span>
        Mis Favoritos
      </h1>
      <p class="text-gray-500 mt-2">Los materiales académicos que has guardado para comprar después.</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-500"></div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && products.length === 0" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-12 text-center max-w-2xl mx-auto mt-10">
      <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4">
        <span class="material-icons text-red-300 text-4xl">heart_broken</span>
      </div>
      <h3 class="text-xl font-bold text-gray-900 mb-2">Aún no tienes favoritos</h3>
      <p class="text-gray-500 mb-6">Explora el catálogo y guarda los artículos que te interesan dándole clic al corazón.</p>
      <a routerLink="/catalog" class="inline-block bg-blue-500 hover:bg-blue-600 text-white font-medium px-6 py-2.5 rounded-full transition-colors shadow-sm">
        Explorar Catálogo
      </a>
    </div>

    <!-- Favorites Grid -->
    <div *ngIf="!loading && products.length > 0" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <app-product-card *ngFor="let product of products" [product]="product"></app-product-card>
    </div>

  </div>
</div>

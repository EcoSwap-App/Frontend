<div class="bg-gray-50 min-h-[calc(100vh-4rem)] pb-12">
  
  <!-- Header Banner -->
  <div class="bg-gradient-to-r from-green-400 to-blue-500 py-8">
    <h1 class="text-3xl font-bold text-center text-white">Mis Productos</h1>
  </div>

  <!-- Products Grid -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-12">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" *ngIf="products.length > 0">
      <app-product-card *ngFor="let product of products" [product]="product"></app-product-card>
    </div>

    <!-- Empty State -->
    <div *ngIf="products.length === 0" class="text-center mt-16 pb-8 flex flex-col items-center justify-center">
      <span class="material-icons text-6xl text-gray-300 mb-4">inventory_2</span>
      <h3 class="text-xl font-medium text-gray-600">Aún no has publicado ningún producto</h3>
      <p class="text-gray-500 mt-2">Sube tu primer artículo para empezar a vender.</p>
    </div>
  </div>
</div>

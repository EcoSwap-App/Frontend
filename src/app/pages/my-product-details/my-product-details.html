<div class="bg-transparent min-h-[calc(100vh-4rem)] pb-12 pt-8" *ngIf="product">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <div class="mb-4">
      <a routerLink="/my-products" class="text-blue-500 hover:text-blue-600 flex items-center gap-1 font-medium">
        <span class="material-icons text-sm">arrow_back</span>
        Volver a mis productos
      </a>
    </div>

    <!-- Management Dashboard -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="flex flex-col md:flex-row">
        
        <!-- Image Gallery -->
        <div class="md:w-1/2 p-6 flex flex-col items-center border-r border-gray-100">
          <div class="w-full aspect-square rounded-xl overflow-hidden bg-gray-100 mb-4 border border-gray-200">
            <img [src]="selectedImage" [alt]="product.title" class="w-full h-full object-cover">
          </div>
        </div>

        <!-- Info & Controls Section -->
        <div class="md:w-1/2 p-8 flex flex-col justify-between bg-green-50/30">
          <div>
            <div class="flex items-center justify-between mb-4">
              <span class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                TU PRODUCTO
              </span>
              <span class="bg-gray-100 text-gray-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                {{ product.status === 'new' ? 'NUEVO' : 'USADO' }}
              </span>
            </div>
            
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">{{ product.title }}</h1>
            <p class="text-sm text-gray-500 mb-6">Publicado el {{ product.createdAt | date:'longDate' }}</p>
            
            <p class="text-gray-700 mb-8 leading-relaxed">
              {{ product.description }}
            </p>

            <div class="text-3xl font-extrabold text-green-600 mb-8">
              S/ {{ product.price | number:'1.2-2' }}
            </div>
          </div>

          <!-- Actions -->
          <div class="space-y-3">
            <button class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition-transform hover:scale-[1.02] flex justify-center items-center gap-2">
              <span class="material-icons text-sm">edit</span>
              Editar Producto
            </button>
            
            <button class="w-full bg-white border-2 border-gray-200 text-gray-700 hover:bg-gray-50 font-bold py-3 px-4 rounded-xl shadow-sm transition-transform hover:scale-[1.02] flex justify-center items-center gap-2">
              <span class="material-icons text-sm">visibility_off</span>
              Pausar Publicación
            </button>
            
            <button class="w-full bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 font-bold py-3 px-4 rounded-xl shadow-sm transition-transform hover:scale-[1.02] flex justify-center items-center gap-2">
              <span class="material-icons text-sm">delete_outline</span>
              Eliminar Producto
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Loading state -->
<div *ngIf="!product" class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-green-500"></div>
</div>

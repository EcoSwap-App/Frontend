<div class="min-h-screen flex">
  <!-- Left Side: Form -->
  <div class="flex-1 flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8 bg-white">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="flex justify-center mb-8">
        <div class="flex flex-col items-center">
          <img class="h-16 w-auto" src="assets/logo.png" alt="EcoSwap" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTBiOTgxIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTIyIDEybC0xMCAxMEwyIDEyVjRoMjB6Ii8+PC9zdmc+'" />
          <span class="text-2xl font-bold text-green-600 mt-2">EcoSwap</span>
        </div>
      </div>

      <h2 class="text-center text-4xl font-extrabold text-gray-900 mb-8">
        Iniciar Sesión
      </h2>

      <div *ngIf="error" class="bg-red-50 text-red-500 p-3 rounded mb-4 text-center">
        {{ error }}
      </div>

      <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div>
          <input type="email" formControlName="email" required class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 focus:z-10 sm:text-sm" placeholder="Correo Universitario">
        </div>
        <div>
          <input type="password" formControlName="password" required class="appearance-none rounded-xl relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 focus:z-10 sm:text-sm" placeholder="Contraseña">
        </div>

        <div>
          <button type="submit" [disabled]="!loginForm.valid" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50">
            Iniciar Sesión
          </button>
        </div>
        
        <div class="text-right">
          <a href="#" class="font-medium text-sm text-gray-600 hover:text-gray-900 border-b border-gray-600">
            Olvidé mi contraseña
          </a>
        </div>
      </form>

      <div class="mt-10 text-center">
        <p class="text-sm text-gray-600">
          ¿No tienes cuenta?
          <a routerLink="/register" class="font-medium text-green-500 hover:text-green-600">
            Crear cuenta
          </a>
        </p>
      </div>
    </div>
  </div>

  <!-- Right Side: Graphic -->
  <div class="hidden lg:flex lg:flex-1 bg-gradient-to-br from-green-400 to-blue-500 relative overflow-hidden rounded-l-[3rem]">
    <div class="absolute inset-0 flex flex-col justify-start items-end p-16 z-10">
      <h2 class="text-4xl font-bold text-white text-right max-w-lg leading-tight">
        Compra y vende materiales académicos con más seguridad y menor costo
      </h2>
    </div>
    <!-- Placeholder Image -->
    <div class="absolute bottom-0 right-0 w-full h-2/3 flex justify-end items-end">
      <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=800" alt="Students" class="object-cover object-top w-4/5 h-full rounded-tl-3xl opacity-90 mix-blend-luminosity hover:mix-blend-normal transition-all" />
    </div>
  </div>
</div>

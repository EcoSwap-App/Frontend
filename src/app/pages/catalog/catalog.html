<div class="bg-transparent min-h-[calc(100vh-4rem)] pb-12">
  
  <!-- Header Banner -->
  <div class="bg-gradient-to-r from-blue-500 to-teal-400 py-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-4">Catálogo de Materiales</h1>
      <p class="text-blue-50 text-lg max-w-2xl mx-auto">Encuentra los libros, calculadoras y recursos que necesitas para este ciclo a un menor costo.</p>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
    
    <!-- Filters -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 mb-8">
      <div class="flex-1 relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
          </svg>
        </div>
        <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="applyFilters()" class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-lg leading-5 bg-gray-50 placeholder-gray-500 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="Buscar por nombre o descripción...">
      </div>
      <div class="w-full md:w-64">
        <select [(ngModel)]="selectedCategory" (ngModelChange)="applyFilters()" class="block w-full px-4 py-3 border border-gray-200 rounded-lg bg-gray-50 text-gray-700 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm appearance-none cursor-pointer">
          <option value="">Todas las clasificaciones</option>
          <option value="1">Libros</option>
          <option value="2">Calculadoras</option>
          <option value="3">Electrónica</option>
        </select>
      </div>
    </div>

    <!-- Products Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <app-product-card *ngFor="let product of filteredProducts" [product]="product"></app-product-card>
    </div>

    <!-- Empty State -->
    <div *ngIf="filteredProducts.length === 0" class="text-center mt-16 text-gray-500 pb-8">
      <svg class="mx-auto h-16 w-16 text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <p class="text-lg font-medium">No se encontraron productos disponibles.</p>
      <p class="text-sm mt-1">Intenta ajustando los filtros de búsqueda.</p>
    </div>
    
    <div *ngIf="filteredProducts.length > 0" class="text-center mt-16 text-gray-400 text-sm pb-8">
      Mostrando {{ filteredProducts.length }} resultado(s)
    </div>
  </div>
</div>

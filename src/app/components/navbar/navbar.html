<nav class="bg-white shadow-sm w-full z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      
      <!-- Logo -->
      <div class="flex items-center flex-1">
        <a routerLink="/home" class="flex-shrink-0 flex items-center gap-2">
          <img class="h-8 w-auto" src="assets/logo.png" alt="EcoSwap" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTBiOTgxIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+PHBhdGggZD0iTTIyIDEybC0xMCAxMEwyIDEyVjRoMjB6Ii8+PC9zdmc+'" />
          <span class="font-bold text-xl text-green-600">EcoSwap</span>
        </a>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-4">
        <a routerLink="/catalog" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-full font-medium transition-colors text-sm shadow-sm">
          Comprar
        </a>
        <a routerLink="/add-product" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-full font-medium transition-colors text-sm shadow-sm">
          Vende
        </a>
        
        <a routerLink="/chat" class="relative text-gray-500 hover:text-green-600 transition-colors p-2">
          <span class="material-icons">chat</span>
        </a>

        <div #notificationsDropdown class="relative group p-2 cursor-pointer text-gray-500 hover:text-green-600 transition-colors" (click)="toggleNotifications()">
          <span class="material-icons">notifications</span>
          <span *ngIf="(unreadCount$ | async) as count" class="absolute top-1 right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[1.25rem] text-center border border-white">
            {{ count }}
          </span>

          <!-- Notifications Dropdown -->
          <div *ngIf="isNotificationsOpen" class="absolute right-0 mt-4 w-80 bg-white border border-gray-200 divide-y divide-gray-100 rounded-lg shadow-xl origin-top-right z-50 max-h-96 overflow-y-auto cursor-default" (click)="$event.stopPropagation()">
            <div class="py-3 px-4 font-bold text-gray-800 bg-gray-50 flex justify-between items-center sticky top-0 border-b border-gray-100">
              Notificaciones
              <button (click)="toggleNotifications()" class="text-gray-400 hover:text-gray-600">
                <span class="material-icons text-sm">close</span>
              </button>
            </div>
            
            <div *ngIf="(notifications$ | async)?.length === 0" class="py-8 text-center text-gray-500 text-sm">
              No tienes notificaciones
            </div>

            <div class="py-2" *ngFor="let n of (notifications$ | async)">
              <div class="px-4 py-3 hover:bg-gray-50 transition-colors" [ngClass]="{'bg-green-50/30': !n.read}">
                <div class="flex justify-between items-start gap-2">
                  <div class="flex-1">
                    <p class="text-sm font-medium text-gray-800" [ngClass]="{'font-bold': !n.read}">{{ n.title || (n.type | titlecase) }}</p>
                    <p class="text-xs text-gray-500 mt-1">{{ n.message || n.text }}</p>
                  </div>
                  <button (click)="deleteNotification(n.id, $event)" class="text-gray-400 hover:text-red-500 transition-colors" title="Eliminar">
                    <span class="material-icons text-xs">close</span>
                  </button>
                </div>
                
                <div class="mt-3 flex gap-2">
                  <button *ngIf="n.type === 'chat' && n.chatId" (click)="goToChat(n.chatId)" class="text-[10px] font-bold uppercase tracking-wider bg-blue-100 text-blue-700 hover:bg-blue-200 px-2 py-1 rounded">
                    Ir al Chat
                  </button>
                  <button *ngIf="!n.read" (click)="markAsRead(n, $event)" class="text-[10px] font-bold uppercase tracking-wider bg-gray-100 text-gray-600 hover:bg-gray-200 px-2 py-1 rounded">
                    Marcar leído
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="relative ml-4 group pb-4 pt-4"> <!-- Added padding for better hover target -->
          <button class="flex items-center gap-2 text-gray-700 hover:text-gray-900 font-medium cursor-pointer">
            <ng-container *ngIf="authService.currentUser$ | async as user">
              <img *ngIf="user.avatar" [src]="user.avatar" class="w-8 h-8 rounded-full object-cover border border-gray-200">
              <div *ngIf="!user.avatar" class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-sm">
                {{ user.name.charAt(0) }}
              </div>
              <span class="max-w-[100px] truncate">{{ user.name.split(' ')[0] }}</span>
            </ng-container>
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </button>
          
          <div class="absolute right-0 w-48 mt-0 origin-top-right bg-white border border-gray-200 divide-y divide-gray-100 rounded-md shadow-lg outline-none opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
            <div class="py-1">
              <a routerLink="/profile" class="text-gray-700 flex justify-between w-full px-4 py-2 text-sm leading-5 text-left hover:bg-gray-100 cursor-pointer">Mi perfil</a>
              <a routerLink="/settings" class="text-gray-700 flex justify-between w-full px-4 py-2 text-sm leading-5 text-left hover:bg-gray-100 cursor-pointer">Configuración</a>
              <a routerLink="/my-products" class="text-gray-700 flex justify-between w-full px-4 py-2 text-sm leading-5 text-left hover:bg-gray-100 cursor-pointer">Mis productos</a>
            </div>
            <div class="py-1">
              <button (click)="logout()" class="text-gray-700 flex justify-between w-full px-4 py-2 text-sm leading-5 text-left hover:bg-gray-100 cursor-pointer">Cerrar sesión</button>
            </div>
          </div>
        </div>
      </div>
      
    </div>
  </div>
</nav>

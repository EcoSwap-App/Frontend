<div [routerLink]="['/product', product.id]" class="bg-white rounded-lg overflow-hidden shadow-sm hover:shadow-md transition-shadow relative cursor-pointer border border-gray-100 flex flex-col h-full">
  <!-- Tag -->
  <div class="absolute top-0 left-0 text-white text-xs font-bold px-3 py-1 -rotate-45 -translate-x-3 translate-y-3 w-24 text-center z-10 shadow-sm"
       [ngClass]="product.status === 'new' ? 'bg-blue-500' : 'bg-red-500'">
    {{ product.status === 'new' ? 'NUEVO' : 'USADO' }}
  </div>

  <!-- Image (Placeholder since no actual assets) -->
  <div class="h-48 w-full bg-gray-200 relative overflow-hidden flex-shrink-0">
    <img [src]="product.images && product.images.length ? 'assets/' + product.images[0] : 'https://images.unsplash.com/photo-1544716278-e513176f20b5?auto=format&fit=crop&q=80&w=400'" alt="{{ product.title }}" class="w-full h-full object-cover">
  </div>

  <div class="p-4 flex flex-col flex-1">
    <h3 class="font-bold text-gray-900 line-clamp-1">{{ product.title }}</h3>
    <p class="text-sm text-gray-500 mt-1 line-clamp-1 flex-1">{{ product.description }}</p>
    
    <div class="mt-2 flex items-center">
      <div class="flex text-yellow-400 text-sm">
        <svg *ngFor="let s of getStars(4.5)" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
        </svg>
        <svg *ngFor="let s of getEmptyStars(4.5)" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-300" viewBox="0 0 20 20" fill="currentColor">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
        </svg>
      </div>
      <span class="text-xs text-gray-500 ml-1">(5)</span>
    </div>
    
    <div class="mt-2 font-bold text-gray-900">
      S/ {{ product.price }}
    </div>
  </div>
</div>
